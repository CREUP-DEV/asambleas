# Dependencies allowed to run install scripts. pnpm >= 11 fails on any undeclared one.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  # Its install script only builds libvips when no prebuilt binary fits; the
  # prebuilt ones (@img/sharp-*) cover Windows and linux/amd64.
  sharp: false
  unrs-resolver: true
  vue-demi: true
