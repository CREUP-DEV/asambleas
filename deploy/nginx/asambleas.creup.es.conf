# Copy to config/nginx/conf.d/ in the root compose directory of the VPS.
# Port 80 is redirected to HTTPS by the shared default server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name asambleas.creup.es;

    access_log /var/log/nginx/asambleas.creup.es.access.log main;
    error_log  /var/log/nginx/asambleas.creup.es.error.log warn;

    # Wildcard *.creup.es certificate shared by every subdomain.
    ssl_certificate     /etc/letsencrypt/live/creup.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creup.es/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Above the app's own cap for PDF uploads (21 MB, nuxt.config.ts routeRules).
    client_max_body_size 25m;

    # Resolved per request through Docker's DNS, so nginx (and every other site
    # it serves) still starts and reloads while asambleas-app does not exist.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $asambleas_app http://asambleas-app:3000;

    # Set here and nowhere below: a location with its own proxy_set_header
    # stops inheriting all of these.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;

    # Compress the API's JSON (and the SSR HTML, always in gzip_types) on the
    # way to Cloudflare, which compresses again towards browsers. Everything
    # is set here, in this server block: a gzip_types here replaces the shared
    # nginx.conf's list for this site only, so it lists the other text types
    # too. Nitro's precompressed /_nuxt/ files already carry Content-Encoding,
    # and nginx never compresses those twice. Off for the live stream below.
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   3;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        application/json application/javascript text/javascript text/css text/plain image/svg+xml;

    # Large API responses (agenda, documents) fit in memory instead of a
    # temporary file with a warning in the log.
    proxy_buffer_size 16k;
    proxy_buffers     16 32k;

    # While the app container is being recreated (a deploy, a rollback) nginx
    # cannot reach it and would answer 502, which Cloudflare replaces with its
    # own "Bad gateway" page. Answer 503 instead, which Cloudflare passes
    # through. Only errors nginx itself produces land here: proxy_intercept_errors
    # stays off, so a 502 or 503 the app sends (a failed Intranet sync) reaches
    # the client as it is.
    error_page 502 503 504 = @unavailable;

    location @unavailable {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "15" always;
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="30">
<title>Volvemos enseguida · Asambleas CREUP</title>
<style>
:root { color-scheme: light dark; --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #475569; --accent: #792225; --border: #e2e8f0; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #cbd5e1; --accent: #f1787c; --border: #334155; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--text); font-family: Raleway, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
main { max-width: 32rem; width: 100%; background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--accent); border-radius: 12px; padding: 32px 28px; }
.brand { margin: 0 0 20px; font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.25; }
p { margin: 0 0 12px; color: var(--muted); }
.status { display: flex; align-items: center; gap: 10px; margin-top: 20px; font-size: .9rem; color: var(--muted); }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0 16px; }
.en { font-size: .9rem; margin: 0; }
</style>
</head>
<body>
<main>
<p class="brand">Asambleas CREUP</p>
<h1>Estamos actualizando la plataforma</h1>
<p>Volverá a estar disponible en unos segundos. No hace falta que hagas nada: esta página se recargará sola en cuanto esté lista.</p>
<p class="status" role="status"><span class="dot" aria-hidden="true"></span>Comprobando de nuevo…</p>
<hr>
<p class="en" lang="en">We are updating the platform. It will be back in a few seconds and this page will reload by itself.</p>
</main>
<script>
(function () {
  function check() {
    fetch(location.href, { method: "HEAD", cache: "no-store", credentials: "same-origin" })
      .then(function (r) { if (r.status < 500) location.reload(); else setTimeout(check, 4000); })
      .catch(function () { setTimeout(check, 4000); });
  }
  setTimeout(check, 4000);
})();
</script>
</body>
</html>';
    }

    location = /api/health {
        deny all;
    }

    # Live updates (server-sent events, heartbeat every 25 s).
    location ~ ^/api/assemblies/[^/]+/live$ {
        proxy_pass $asambleas_app;
        proxy_buffering off;
        proxy_cache off;
        # gzip would hold events back until its buffer fills.
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /_nuxt/ {
        proxy_pass $asambleas_app;
    }

    location / {
        proxy_pass $asambleas_app;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
