# Copy to config/nginx/conf.d/ in the root compose directory of the VPS.
# Port 80 is redirected to HTTPS by the shared default server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name asambleas.creup.es;

    access_log /var/log/nginx/asambleas.creup.es.access.log main;
    error_log  /var/log/nginx/asambleas.creup.es.error.log warn;

    # Wildcard *.creup.es certificate shared by every subdomain.
    ssl_certificate     /etc/letsencrypt/live/creup.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creup.es/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Above the app's own cap for PDF uploads (21 MB, nuxt.config.ts routeRules).
    client_max_body_size 25m;

    # Resolved per request through Docker's DNS, so nginx (and every other site
    # it serves) still starts and reloads while asambleas-app does not exist.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $asambleas_app http://asambleas-app:3000;

    # Set here and nowhere below: a location with its own proxy_set_header
    # stops inheriting all of these.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;

    location = /api/health {
        deny all;
    }

    # Live updates (server-sent events, heartbeat every 25 s).
    location ~ ^/api/assemblies/[^/]+/live$ {
        proxy_pass $asambleas_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /_nuxt/ {
        proxy_pass $asambleas_app;
    }

    location / {
        proxy_pass $asambleas_app;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
